name: ui-smoke

# FlaUI UI automation smoke: launch the wizard, drive the shell, verify the
# page graph renders. Engine-dependent flows (real scan/recover) run in the
# contract job against the rrecov CLI; this job exercises the UI surface on
# a real Windows desktop session.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/RdaWizard.Ui.Tests/**'
      - '.github/workflows/ui-smoke.yml'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  ui-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build app + UI tests
        run: |
          dotnet build src/RdaWizard.App/RdaWizard.App.csproj -c Release
          dotnet build tests/RdaWizard.Ui.Tests/RdaWizard.Ui.Tests.csproj -c Release

      - name: Run FlaUI smoke
        run: dotnet test tests/RdaWizard.Ui.Tests/RdaWizard.Ui.Tests.csproj -c Release --logger trx --results-directory ./TestResults

      - name: Collect app logs (diagnosability)
        if: always()
        shell: pwsh
        run: |
          $logDir = Join-Path $env:LOCALAPPDATA "RdaWizard\logs"
          if (Test-Path $logDir) {
            New-Item -ItemType Directory -Force -Path ./AppLogs | Out-Null
            Copy-Item $logDir\* ./AppLogs/ -ErrorAction SilentlyContinue
            Get-ChildItem ./AppLogs | ForEach-Object { Write-Host "===== $($_.Name) ====="; Get-Content $_.FullName -Tail 80 }
          } else {
            Write-Host "No app log directory at $logDir — the app may have died before Serilog initialized."
          }

      - name: Collect shell screenshots (T4 deliverable)
        if: always()
        shell: pwsh
        run: |
          $shotDir = "tests/RdaWizard.Ui.Tests/bin/Release/net10.0-windows/screenshots"
          if (Test-Path $shotDir) {
            New-Item -ItemType Directory -Force -Path ./Screenshots | Out-Null
            Copy-Item $shotDir\*.png ./Screenshots/ -ErrorAction SilentlyContinue
            Get-ChildItem ./Screenshots | ForEach-Object { Write-Host "captured: $($_.Name) ($($_.Length) bytes)" }
          } else {
            Write-Host "No screenshots captured (tests may have failed before capture)."
          }

      - name: Upload test results + app logs + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-results-${{ github.run_id }}
          path: |
            ./TestResults
            ./AppLogs
            ./Screenshots
          retention-days: 30
